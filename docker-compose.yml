version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_center
      POSTGRES_USER: control_center
      POSTGRES_PASSWORD: control_center_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_center"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://control_center:control_center_dev@db:5432/control_center
      - DJANGO_ENV=dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
